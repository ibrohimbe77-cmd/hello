<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Маленький сюрприз</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>
  <main class="card">
    <div class="flower">🌷</div>
    <p class="eyebrow">маленький сюрприз</p>
    <h1>Для хорошего человека</h1>
    <p class="intro">Иногда хочется просто подарить кому-то немного улыбки.</p>
    <button id="openBtn">Открыть ✨</button>
    <div id="message" class="message" aria-live="polite" hidden>
      <div class="sparkle">💖</div>
      <p>Ты классная. Пусть у тебя сегодня будет много поводов улыбнуться, хорошее настроение и побольше счастливых моментов.</p>
      <p class="small">Просто захотелось сказать это 🙂</p>
    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>
